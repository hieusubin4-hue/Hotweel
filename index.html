<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 Hot Wheels Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff0000, #ffcc00, #0066ff);
    }
    header {
      text-align: center;
      padding: 20px;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }
    button {
      background: #ff0000;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      font-weight: bold;
    }
    button:hover {
      background: #cc0000;
    }
    .section {
      background: white;
      margin-top: 30px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>🔥 Hot Wheels Store</header>

<div class="container">

  <div class="products" id="product-list"></div>

  <div class="section">
    <h2>🛒 Giỏ hàng</h2>
    <div id="cart"></div>
    <hr>
    <h3>Tổng: <span id="total">0</span> VND</h3>
  </div>

  <div class="section">
    <h2>📦 Thanh toán</h2>
    <input type="text" id="name" placeholder="Họ và tên">
    <input type="text" id="phone" placeholder="Số điện thoại">
    <textarea id="address" placeholder="Địa chỉ giao hàng"></textarea>
    <button onclick="checkout()">Xác nhận đặt hàng</button>
    <p id="message" style="color:green;font-weight:bold;"></p>
  </div>

</div>

<script>
  const products = [
    { id: 1, name: "Dragon Blaster", price: 129000, image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=800" },
    { id: 2, name: "Speed Racer", price: 99000, image: "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?q=80&w=800" },
    { id: 3, name: "Monster Truck", price: 149000, image: "https://images.unsplash.com/photo-1596464716127-f2a82984de30?q=80&w=800" }
  ];

  let cart = [];

  function renderProducts() {
    const list = document.getElementById("product-list");
    list.innerHTML = "";
    products.forEach(p => {
      list.innerHTML += `
        <div class="card">
          <img src="${p.image}" />
          <h3>${p.name}</h3>
          <p><b>${p.price.toLocaleString()} VND</b></p>
          <button onclick="addToCart(${p.id})">Thêm vào giỏ</button>
        </div>
      `;
    });
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const item = cart.find(i => i.id === id);
    if (item) {
      item.quantity++;
    } else {
      cart.push({ ...product, quantity: 1 });
    }
    renderCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    renderCart();
  }

  function renderCart() {
    const cartDiv = document.getElementById("cart");
    const totalSpan = document.getElementById("total");
    cartDiv.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
      total += item.price * item.quantity;
      cartDiv.innerHTML += `
        <div class="cart-item">
          <span>${item.name} (${item.quantity})</span>
          <span>${(item.price * item.quantity).toLocaleString()} VND
          <button onclick="removeFromCart(${item.id})">X</button></span>
        </div>
      `;
    });

    totalSpan.innerText = total.toLocaleString();
  }

  function checkout() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;

    if (!name || !phone || !address) {
      alert("Vui lòng nhập đầy đủ thông tin!");
      return;
    }

    if (cart.length === 0) {
      alert("Giỏ hàng đang trống!");
      return;
    }

    document.getElementById("message").innerText = "🎉 Đặt hàng thành công!";
    cart = [];
    renderCart();
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("address").value = "";
  }

  renderProducts();
</script>

</body>
</html>
